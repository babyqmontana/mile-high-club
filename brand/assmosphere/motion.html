<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>The Ass.mosphere Club — моушн-заставка</title>
<!-- Квадратная заставка 6.4 с, начинается и заканчивается пустым небом, поэтому повтор незаметен.
     Сюжет: прорисовывается горизонт, встаёт солнце, проявляется надпись. Из-за горизонта осторожно выглядывает
     «облако» (две половинки — верблюжья задница), осматривается, выпрыгивает с отскоком и пружинит.
     Свет бежит по контуру, по надписи проходит блик. Потом облако приседает и ныряет за горизонт
     с облачком брызг, солнце садится, надпись и горизонт уходят. render(frame) детерминирован. -->
<style>html,body{margin:0;background:#080103}canvas{display:block;width:min(100vw,100vh);height:min(100vw,100vh);margin:auto}</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const N = 1080, FPS = 25, DUR = 6.4, FRAMES = Math.round(DUR * FPS);
const GEO = { cw: 1809, ch: 874, sun: [1170.4, 290.4, 320.6], hz: 496 };
const SC = 960 / GEO.cw, OX = (N - 960) / 2, OY = 560 - GEO.ch * SC / 2;
const X = x => OX + x * SC, Y = y => OY + y * SC, HZ = Y(GEO.hz);
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = c.height = N; return [c, c.getContext('2d')]; };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
const eo3 = x => 1 - (1 - x) ** 3, ein = x => x * x * x;
const back = (x, s = 2.2) => x <= 0 ? 0 : 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
function glow(c, x, y, r, rgb, a) { if (a <= 0) return; const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); }

// слои: облако (линия над горизонтом + заливка), горизонт, надпись
let CLOUD_LINE, CLOUD_FILL, HORIZON, TEXT, CLOUD_TOP;
async function ready() {
  const [l, f] = await Promise.all([img('line.png'), img('cloudfill.png')]);
  const place = (src, clip) => { const [c, g] = mk(); g.save(); g.beginPath(); clip(g); g.clip(); g.drawImage(src, OX, OY, GEO.cw * SC, GEO.ch * SC); g.restore(); return c; };
  CLOUD_LINE = place(l, g => g.rect(0, 0, N, HZ - 5));
  HORIZON = place(l, g => g.rect(0, HZ - 5, N, 17));
  TEXT = place(l, g => g.rect(0, HZ + 12, N, N));
  CLOUD_FILL = place(f, g => g.rect(0, 0, N, HZ - 2));
  // верх облака: первая непрозрачная строка
  const d = CLOUD_LINE.getContext('2d').getImageData(0, 0, N, N).data; CLOUD_TOP = 0;
  for (let y = 0; y < N && !CLOUD_TOP; y++) for (let x = 0; x < N; x += 2) if (d[(y * N + x) * 4 + 3] > 60) { CLOUD_TOP = y; break; }
  render(0);
}
// кремовая заливка маски с градиентом
function tint(src, top, bot, extra) {
  const [c, g] = mk(); g.drawImage(src, 0, 0); g.globalCompositeOperation = 'source-in';
  const gr = g.createLinearGradient(0, top, 0, bot); gr.addColorStop(0, '#FFF3DF'); gr.addColorStop(.5, '#F4E2C6'); gr.addColorStop(1, '#E9CFAA'); g.fillStyle = gr; g.fillRect(0, 0, N, N);
  if (extra) { g.globalCompositeOperation = 'source-atop'; extra(g); }
  return c;
}
function drawGlowing(c, a = 1, boost = 0) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a * (.35 + boost); ctx.filter = 'blur(14px)'; ctx.drawImage(c, 0, 0);
  ctx.globalAlpha = a * .3; ctx.filter = 'blur(3px)'; ctx.drawImage(c, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = a; ctx.drawImage(c, 0, 0); ctx.restore();
}
function star(x, y, r, a, rot) {
  if (a < .02) return; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
  glow(ctx, 0, 0, r * .55, '255,225,200', .9); ctx.fillStyle = '#fff6ec';
  for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); const L = i % 2 ? r : r * .6; ctx.beginPath(); ctx.moveTo(0, -L); ctx.quadraticCurveTo(r * .07, -r * .07, r * .09, 0); ctx.lineTo(-r * .09, 0); ctx.quadraticCurveTo(-r * .07, -r * .07, 0, -L); ctx.fill(); }
  ctx.restore();
}

/* ---------- облако-«верблюд» ---------- */
const CHEEK_L = X(790), CHEEK_R = X(1190), CHEEK_W = 175 * SC * 1.1;
// подъём (0 — спрятан за горизонтом, 1 — на месте), сдвиг, растяжение по вертикали, колыхание половинок
function cloudState(t) {
  let rise = 0, dx = 0, sy = 1, jl = 0, jr = 0;
  // выглядывает: показывается верх, осматривается
  rise = .36 * eo3(prog(t, 1.45, 1.85));
  if (t > 1.85 && t < 2.3) dx = 14 * Math.sin((t - 1.85) / .45 * TAU);
  // прыжок с отскоком
  if (t >= 2.3) rise = lerp(.36, 1, back(prog(t, 2.3, 2.62), 2.4));
  if (t >= 2.3 && t < 2.75) sy = 1 + .1 * Math.sin(prog(t, 2.3, 2.75) * Math.PI);           // вытягивается в прыжке
  if (t >= 2.62 && t < 3.0) sy = 1 - .08 * Math.sin(prog(t, 2.62, 3.0) * Math.PI) * (1 - prog(t, 2.62, 3.0)); // приземление
  // пружинит после прыжка
  if (t > 2.62 && t < 3.4) { const k = t - 2.62, d = Math.exp(-k * 5); jl = 13 * Math.sin(k * 24) * d; jr = 13 * Math.sin(k * 24 - 1.4) * d; }
  // покачивает половинками туда-сюда
  if (t > 3.95 && t < 4.4) { const p = prog(t, 3.95, 4.4), e = Math.sin(p * Math.PI); jl = 12 * Math.sin(p * TAU * 2) * e; jr = -12 * Math.sin(p * TAU * 2) * e; }
  // приседает и ныряет
  if (t > 4.45 && t < 4.62) { const p = prog(t, 4.45, 4.62); sy = 1 - .1 * eio(p); }
  if (t >= 4.62) { const p = prog(t, 4.62, 4.9); rise = 1 - ein(p) * 1.05; sy = lerp(.9, 1.12, eo3(p)); }
  // перелёт вверх превращаем в вытягивание: низ облака не отрывается от горизонта
  if (rise > 1) { sy += (rise - 1) * .9; rise = 1; }
  return { rise, dx, sy, jl, jr };
}
// рисуем облако столбиками: у каждого свой сдвиг по вертикали (колыхание), всё обрезано горизонтом
function drawCloud(t, src) {
  const s = cloudState(t); if (s.rise <= 0) return;
  const hide = (1 - s.rise) * (HZ - CLOUD_TOP + 14);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, N, HZ - 2); ctx.clip();
  const step = 4;
  for (let x = 0; x < N; x += step) {
    const xc = x + step / 2;
    const j = s.jl * Math.exp(-(((xc - CHEEK_L) / CHEEK_W) ** 2)) + s.jr * Math.exp(-(((xc - CHEEK_R) / CHEEK_W) ** 2));
    const h = HZ;                                  // источник: от 0 до горизонта
    const dh = h * s.sy, dy = HZ - dh + hide - j;
    ctx.drawImage(src, x, 0, step, h, x + s.dx, dy, step, dh);
  }
  ctx.restore();
}
// брызги облачков на горизонте
function splash(t, t0, cx) {
  const p = prog(t, t0, t0 + .6); if (p <= 0 || p >= 1) return;
  for (let i = 0; i < 14; i++) {
    const a = Math.PI + hash(i) * Math.PI, sp = 110 + 160 * hash(i + 3), x = cx + (hash(i + 5) - .5) * 360 + Math.cos(a) * sp * eo3(p), y = HZ - 6 + Math.sin(a) * sp * .55 * eo3(p) + 40 * p * p;
    const r = (14 + 22 * hash(i + 7)) * (.6 + p), al = .5 * (1 - p);
    const gr = ctx.createRadialGradient(x, y - r * .3, 0, x, y, r * 1.3); gr.addColorStop(0, `rgba(255,243,223,${al})`); gr.addColorStop(.55, `rgba(244,226,198,${al * .7})`); gr.addColorStop(1, 'rgba(244,226,198,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r * 1.3, 0, TAU); ctx.fill();
  }
}

function render(frame) {
  const t = (frame % FRAMES) / FPS;
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  const [sx0, sy0, sr0] = GEO.sun, sx = X(sx0), sr = sr0 * SC;
  const sunUp = eo3(prog(t, .4, 1.4)) * (1 - eio(prog(t, 4.9, 5.7)));
  const sy = Y(sy0) + (1 - sunUp) * (sr * 2.2) + 8 * Math.sin(t * 1.4);
  const breathe = .5 + .5 * Math.sin(t * 2.2);

  // 1. фон и звёзды (одинаковые в начале и в конце петли)
  ctx.fillStyle = '#080103'; ctx.fillRect(0, 0, N, N);
  glow(ctx, N * .52, N * .5, N * .78, '84,12,26', .72 + .1 * sunUp);
  for (let i = 0; i < 46; i++) {
    const x = hash(i) * N, y = hash(i + 50) * N * .92, tw = .5 + .5 * Math.sin(TAU * (t / DUR) * (1 + (i % 3)) + TAU * hash(i + 9));
    ctx.globalAlpha = (.12 + .5 * hash(i + 3)) * tw; ctx.fillStyle = '#f6e4cc'; ctx.beginPath(); ctx.arc(x, y, .8 + 1.6 * hash(i + 7), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 2. солнце: лучи и ореол гаснут к горизонту, диск обрезан горизонтом
  if (sunUp > 0) {
    const [Rc, R] = mk();
    glow(R, sx, sy, sr * 3, '150,24,40', .2 * sunUp);
    R.save(); R.translate(sx, sy); R.rotate(t * .12); R.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) { R.rotate(TAU / 12); const lg = R.createLinearGradient(0, 0, 0, -sr * 3.4); lg.addColorStop(0, 'rgba(255,120,120,0)'); lg.addColorStop(.3, `rgba(255,140,130,${(.06 + .03 * breathe) * sunUp})`); lg.addColorStop(1, 'rgba(255,140,130,0)'); R.fillStyle = lg; R.beginPath(); R.moveTo(0, 0); R.lineTo(-sr * .22, -sr * 3.4); R.lineTo(sr * .22, -sr * 3.4); R.closePath(); R.fill(); }
    R.restore(); glow(R, sx, sy, sr * 1.7, '190,36,52', (.3 + .12 * breathe) * sunUp);
    R.globalCompositeOperation = 'destination-in'; const fg = R.createLinearGradient(0, HZ - 120, 0, HZ + 10); fg.addColorStop(0, '#000'); fg.addColorStop(1, 'rgba(0,0,0,0)'); R.fillStyle = fg; R.fillRect(0, 0, N, N);
    ctx.drawImage(Rc, 0, 0);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, N, HZ - 2); ctx.clip();
    const g = ctx.createRadialGradient(sx - sr * .3, sy - sr * .35, sr * .1, sx, sy, sr); g.addColorStop(0, '#b42a38'); g.addColorStop(.7, '#8f1c2a'); g.addColorStop(1, '#741520');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill(); ctx.restore();
  }

  // 3. облако-верблюд: заливка + линия, со светом по контуру (3.0–3.6)
  const [Cc, C] = mk();
  C.drawImage(CLOUD_FILL, 0, 0); C.globalCompositeOperation = 'source-in';
  let g = C.createLinearGradient(0, CLOUD_TOP, 0, HZ); g.addColorStop(0, '#2a0910'); g.addColorStop(1, '#14040a'); C.fillStyle = g; C.fillRect(0, 0, N, N);
  C.globalCompositeOperation = 'source-over';
  const ca = prog(t, 3.0, 3.6);
  const line = tint(CLOUD_LINE, CLOUD_TOP, HZ, ca > 0 && ca < 1 ? G => {
    const cg = G.createConicGradient(Math.PI * (.95 + 1.15 * eio(ca)) - .35, X(900), Y(380));
    cg.addColorStop(0, 'rgba(255,200,160,0)'); cg.addColorStop(.035, 'rgba(255,210,170,.9)'); cg.addColorStop(.05, '#fff'); cg.addColorStop(.065, 'rgba(255,200,160,.5)'); cg.addColorStop(.11, 'rgba(255,200,160,0)'); cg.addColorStop(1, 'rgba(255,200,160,0)');
    G.fillStyle = cg; G.fillRect(0, 0, N, N); } : null);
  C.filter = 'blur(14px)'; C.globalAlpha = .45 + .3 * Math.sin(Math.PI * ca); C.drawImage(line, 0, 0);
  C.filter = 'none'; C.globalAlpha = 1; C.drawImage(line, 0, 0);
  drawCloud(t, Cc);
  splash(t, 2.32, X(990)); splash(t, 4.78, X(990));

  // 4. туман под горизонтом
  for (let i = 0; i < 6; i++) { const k = i + 10, ph = ((hash(k + 1) - t / DUR * (1 + (i % 2))) % 1 + 1) % 1, x = -300 + ph * (N + 600), y = HZ + 90 + hash(k + 2) * 120, w = 260 + hash(k + 3) * 300;
    ctx.save(); ctx.translate(x, y); ctx.scale(1, .32); glow(ctx, 0, 0, w, '246,220,200', .07 * sunUp); ctx.restore(); }

  // 5. горизонт: прорисовывается из центра, в конце втягивается обратно
  const hIn = eio(prog(t, .15, .75)), hOut = eio(prog(t, 5.5, 6.0)), hw = hIn * (1 - hOut);
  if (hw > 0) { const hc = tint(HORIZON, HZ - 6, HZ + 10); ctx.save(); ctx.beginPath(); ctx.rect(N / 2 - N / 2 * hw, 0, N * hw, N); ctx.clip(); drawGlowing(hc, 1, .1);
    glow(ctx, N / 2 - N / 2 * hw, HZ, 50, '255,240,220', .9 * (hw < 1 ? 1 : 0)); glow(ctx, N / 2 + N / 2 * hw, HZ, 50, '255,240,220', .9 * (hw < 1 ? 1 : 0)); ctx.restore(); }

  // 6. надпись: проявляется слева направо, уходит справа налево; блик 3.55–4.05
  const tIn = eio(prog(t, .55, 1.3)), tOut = eio(prog(t, 5.15, 5.75));
  if (tIn > 0 && tOut < 1) {
    const ta = prog(t, 3.55, 4.05);
    const tc = tint(TEXT, HZ, Y(GEO.ch), ta > 0 && ta < 1 ? G => { G.save(); G.translate(N / 2, N / 2); G.rotate(.45); G.translate(-N / 2, -N / 2);
      const x0 = -300 + 1700 * eio(ta); const lg = G.createLinearGradient(x0 - 120, 0, x0 + 120, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, '#fff'); lg.addColorStop(1, 'rgba(255,255,255,0)'); G.fillStyle = lg; G.fillRect(-N, -N, N * 3, N * 3); G.restore(); } : null);
    // мягкая шторка: видимая часть от левого края до фронта
    const [Mc, Mg] = mk(); Mg.drawImage(tc, 0, 0); Mg.globalCompositeOperation = 'destination-in';
    const front = lerp(-160, N + 160, tIn), back2 = lerp(-160, N + 160, 1 - tOut);
    const lg = Mg.createLinearGradient(0, 0, N, 0);
    const st = (v) => clamp(v / N);
    lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(st(Math.max(0, front - 160)), '#000'); lg.addColorStop(st(front), 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
    Mg.fillStyle = tIn >= 1 ? '#000' : lg; Mg.fillRect(0, 0, N, N);
    if (tOut > 0) { const og = Mg.createLinearGradient(0, 0, N, 0); og.addColorStop(0, '#000'); og.addColorStop(st(Math.max(0, back2 - 160)), '#000'); og.addColorStop(st(back2), 'rgba(0,0,0,0)'); og.addColorStop(1, 'rgba(0,0,0,0)'); Mg.fillStyle = og; Mg.fillRect(0, 0, N, N); }
    drawGlowing(Mc, 1, .25 * Math.sin(Math.PI * clamp(ta)) * (ta > 0 && ta < 1));
  }

  // 7. искры
  [[790, 40, 3.25], [1450, 150, 3.45], [90, 563, 3.62], [914, 653, 3.78], [1780, 623, 3.92], [1470, 827, 4.02], [1180, 120, 2.6]].forEach(([x, y, at], i) => star(X(x), Y(y), 46 + 20 * hash(i), Math.exp(-(((t - at) / .07) ** 2)), t * 2 + i));

  // 8. виньетка
  g = ctx.createRadialGradient(N / 2, N / 2, N * .42, N / 2, N / 2, N * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, N, N);
}
window.ANIM = { N, FPS, FRAMES, ready, render };
if (!new URLSearchParams(location.search).has('still')) ready().then(() => { let f = 0; setInterval(() => render(f++), 1000 / FPS); });
</script>
</body>
</html>
