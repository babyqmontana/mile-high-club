upstream mhc {
  server 127.0.0.1:3000;
  keepalive 32;                       # постоянные соединения с Node: без нового TCP на каждый запрос
}

server {
  listen 80;
  listen [::]:80;
  server_name mhc-ls-project.ru www.mhc-ls-project.ru;
  client_max_body_size 50m;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Картинки, 3D-модели и шрифты отдаёт nginx прямо с диска — Node их даже не видит
  location ~* ^/(img|models|fonts)/.+\.(webp|png|jpg|jpeg|gif|svg|glb|woff2)$ {
    root /opt/mhc/public;
    expires 7d;
    add_header Cache-Control "public";
    access_log off;
    try_files $uri @node;
  }
  # Загруженные в панели файлы: имена уникальные, кэшируются надолго
  location /uploads/ {
    alias /opt/mhc/data/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
  }
  # Поток живых обновлений: без буферизации и с долгим таймаутом
  location = /api/stream {
    proxy_pass http://mhc;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  # Всё остальное — Node: скрипты и стили он отдаёт уже сжатыми из памяти, данные — с ETag
  location / {
    proxy_pass http://mhc;
  }
  location @node {
    proxy_pass http://mhc;
  }
}
