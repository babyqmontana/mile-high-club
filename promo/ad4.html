<body>

<script type="module">
// Ролик v4: ~30 с, без музыки, со звуковыми эффектами. Две версии: 16:9 и 9:16 (?v=1).
// Внутри — настоящая 3D-башня сайта (public/js/skyline3d.js, без изменений): камера облетает здание,
// лифт едет на этаж, окна номеров подсвечиваются, номер выбирается и бронируется.
// Время сцены подменено (performance.now / requestAnimationFrame), поэтому каждый кадр детерминирован.
const Q = new URLSearchParams(location.search), V = Q.get('v') === '1';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080, FPS = 30, DUR = 30;
const U = Math.min(W, H) / 1080;                       // единица размера интерфейса
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
const host = document.getElementById('host'); host.style.width = W + 'px'; host.style.height = H + 'px';
const C = { ink: '#F6E8D2', mut: 'rgba(246,232,210,.62)', gold: '#F7B50A', pink: '#F0177A', wine: '#7A1E26', violet: '#B45CFF', bg0: '#0b0508', bg1: '#24101c' };
const BODY = 'Onest', DISP = 'Unbounded', SERIF = 'Cormorant Garamond';

/* ---------- детерминизм: свой генератор случайных чисел и подменённое время ---------- */
let seed = 1234567; Math.random = () => { seed ^= seed << 13; seed >>>= 0; seed ^= seed >> 17; seed ^= seed << 5; seed >>>= 0; return seed / 4294967296; };
let VT = 0; const RQ = [];
performance.now = () => VT; window.requestAnimationFrame = cb => { RQ.push(cb); return RQ.length; }; window.cancelAnimationFrame = () => {};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo3 = x => 1 - (1 - x) ** 3, eo5 = x => 1 - (1 - x) ** 5, ein = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2;
const back = (x, s = 1.7) => x <= 0 ? 0 : 1 + (s + 1) * (x - 1) ** 3 + s * (x - 1) ** 2;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2;

/* ---------- таймлайн (секунды) ---------- */
const T = {
  phoneIn: 0, chips: .5, dive: 2.5, flyStart: 2.9, title1: 3.8, title2: 5.6, flyEnd: 9.8,
  lift: 10.2, press: 11.3, arrive: 13.0, plan: 13.4, hover0: 13.9, pick: 16.0, card: 16.3, book: 18.6, booked: 18.8,
  dolly: 19.6, flash: 20.5, form: 20.6, send: 22.3, ok: 23.0, toast: 23.6, pull: 25.4, logo: 26.6, cta: 27.9, end: 30
};
const FLOOR = 23, ROOM = '2304';

/* ---------- данные сайта и башня ---------- */
let DATA, tw, IMG = {}, snapT = null, rooms;
const load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[k] = i; r(); }; i.onerror = () => r(); i.src = src; });
async function ready() {
  if (tw) return;
  const FACES = ['800 40px "Unbounded"', '400 40px "Onest"', '700 40px "Onest"', 'italic 600 40px "Cormorant Garamond"'];
  await Promise.all([...FACES.map(f => document.fonts.load(f, 'Абвгд Abc 0123$')), load('mob', '/promo/assets/mob-home.webp'), load('emblem', '/brand/emblem.png')]);
  DATA = await (await fetch('/promo/assets/ad4-data.json')).json();
  rooms = DATA.rooms.map(r => ({ ...r }));
  const { mountTower } = await import('/public/js/skyline3d.js');
  tw = mountTower(host, {});
  await new Promise(r => setTimeout(r, 200));
  tw.active(true);
  tw.setVenues(DATA.venues.map(v => ({ id: v.id, name: v.name, kind: v.kind, accent: v.accent || '#f7b50a', floor: parseInt((String(v.floor || '').match(/\d+/) || [1])[0], 10), label: '' })));
  tw.update(rooms, null, DATA.types);
  snapT = document.createElement('canvas'); snapT.width = W; snapT.height = H;
  window.__onRender = el => { snapT.getContext('2d').drawImage(el, 0, 0, W, H); };
  window.__camHook = camHook;
}

// действия с башней, привязанные ко времени (применяются по порядку и при «догоне»)
const ACTIONS = [
  [T.press + .15, () => tw.update(rooms, FLOOR, DATA.types)],
  ...[1, 2, 3, 4, 5, 6].map((n, i) => [T.hover0 + i * .3, () => tw.hoverRoom(`${FLOOR}0${n}`)]),
  [T.hover0 + 1.8, () => tw.hoverRoom(null)],
  [T.pick, () => tw.focusRoom(ROOM)],
  [T.booked, () => { rooms = rooms.map(r => r.id === ROOM ? { ...r, status: 'booked' } : r); tw.update(rooms, FLOOR, DATA.types); }]
];
let applied = 0, simT = -1;

// камера: свой облёт (вес 1) плавно переходит в камеру сайта (вес 0) — на ней лифт, выбор номера и разворот к окну
function myCam(t) {
  const p = eio(prog(t, T.flyStart, T.flyEnd + .6));
  const a = lerp(2.9, .55, p), r = lerp(58, 31, p) * (V ? 1.25 : 1), y = lerp(46, 11, eio(p)), ly = lerp(2, 9.5, p);
  return { p: [Math.sin(a) * r, y, Math.cos(a) * r], l: [0, ly, 0], fov: V ? 58 : 36 };
}
function camHook(c) {
  const t = VT / 1000;
  const wFly = 1 - eio(prog(t, T.flyEnd - .4, T.flyEnd + .8));
  const dolly = eio(prog(t, T.dolly, T.flash + .05)) * (1 - eio(prog(t, T.flash + .05, T.flash + .9)));
  const np = c.position.clone(), d = c.getWorldDirection(c.position.clone().set(0, 0, 0));
  const k = -(np.x * d.x + np.z * d.z) / Math.max(1e-4, d.x * d.x + d.z * d.z), nt = np.clone().addScaledVector(d, k);
  // базовый угол обзора задаём каждый кадр заново, чтобы изменения не накапливались
  const base = V ? 46 : 32; let pos = np, tgt = nt, fov = base;
  if (wFly > 0) {
    const m = myCam(t);
    pos = np.clone().lerp({ x: m.p[0], y: m.p[1], z: m.p[2] }, wFly); tgt = nt.clone().lerp({ x: m.l[0], y: m.l[1], z: m.l[2] }, wFly); fov = lerp(base, m.fov, wFly);
  }
  if (dolly > 0) { pos = pos.clone().lerp(tgt, .78 * dolly); fov = fov * (1 - .35 * dolly); }
  c.position.copy(pos); c.lookAt(tgt); if (c.fov !== fov) { c.fov = fov; c.updateProjectionMatrix(); }
}
function stepTower(t, draw) {
  while (applied < ACTIONS.length && ACTIONS[applied][0] <= t) { ACTIONS[applied][1](); applied++; }
  VT = t * 1000; window.__skip = !draw; window.__rendered = false;
  for (let g = 0; g < 6 && !window.__rendered; g++) { const q = RQ.splice(0); if (!q.length) { tw.active(true); continue; } q.forEach(cb => cb(VT)); }
  window.__skip = false;
}
const towerOn = t => t > T.dive - .1 && t < T.pull + 1.2;
function advanceTower(t) {
  // догоняем состояние сцены кадр за кадром без отрисовки, если рендер начат с середины
  for (let f = Math.max(0, Math.floor(simT * FPS) + 1); f < Math.round(t * FPS); f++) stepTower(f / FPS, false);
  stepTower(t, towerOn(t)); simT = t;
}

/* ---------- рисование ---------- */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function font(size, w = 700, fam = BODY, style = '') { ctx.font = `${style} ${w} ${size}px "${fam}"`; }
function txt(s, x, y, size, color, o = {}) { font(size, o.w || 700, o.fam || BODY, o.style || ''); ctx.fillStyle = color; ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic'; if (o.track) ctx.letterSpacing = o.track + 'px'; ctx.fillText(s, x, y); ctx.letterSpacing = '0px'; }
function tw_(s, size, w = 700, fam = BODY, style = '') { font(size, w, fam, style); return ctx.measureText(s).width; }
function glow(x, y, r, rgb, a) { if (a <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
// стекло: размытая подложка из того, что уже нарисовано, тонкая светлая кромка и блик
let BASE = null;
function snapshotBase() { if (!BASE) { BASE = document.createElement('canvas'); BASE.width = W; BASE.height = H; } const b = BASE.getContext('2d'); b.clearRect(0, 0, W, H); b.drawImage(cv, 0, 0); }
function glass(x, y, w, h, r, a = 1, tint = 'rgba(255,240,230,.07)') {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50 * U; ctx.shadowOffsetY = 20 * U; rr(x, y, w, h, r); ctx.fillStyle = 'rgba(20,8,14,.35)'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.filter = `blur(${26 * U}px) saturate(1.4)`; ctx.drawImage(BASE, 0, 0); ctx.filter = 'none';
  ctx.fillStyle = tint; ctx.fillRect(x, y, w, h);
  const g = ctx.createLinearGradient(x, y, x + w * .6, y + h); g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(.4, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
  const e = ctx.createLinearGradient(x, y, x + w, y + h); e.addColorStop(0, 'rgba(255,255,255,.45)'); e.addColorStop(.5, 'rgba(255,255,255,.08)'); e.addColorStop(1, 'rgba(247,181,10,.35)');
  rr(x + .5, y + .5, w - 1, h - 1, r); ctx.lineWidth = 1.5 * U; ctx.strokeStyle = e; ctx.stroke(); ctx.restore();
}
function emblem(x, y, r, a = 1) { const i = IMG.emblem; if (!i || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(i, x - r, y - r, r * 2, r * 2); ctx.restore(); }
function cursor(x, y, press = 0, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); const s = U * 1.1 * (1 - .15 * press); ctx.scale(s, s);
  if (press > .05) { ctx.save(); ctx.globalAlpha *= press; ctx.beginPath(); ctx.arc(0, 0, 34, 0, TAU); ctx.fillStyle = 'rgba(247,181,10,.35)'; ctx.fill(); ctx.restore(); }
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.lineTo(11, 33); ctx.lineTo(19, 51); ctx.lineTo(27, 47); ctx.lineTo(19, 30); ctx.lineTo(34, 30); ctx.closePath();
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 4; ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 3; ctx.strokeStyle = '#140a0e'; ctx.stroke(); ctx.restore();
}
function ripple(x, y, t, at, rgb = '247,181,10') { const p = prog(t, at, at + .5); if (p <= 0 || p >= 1) return; ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = `rgb(${rgb})`; ctx.lineWidth = 3 * U; ctx.beginPath(); ctx.arc(x, y, (20 + 90 * eo3(p)) * U, 0, TAU); ctx.stroke(); ctx.restore(); }

/* ---------- 3D-телефон: проекция прямоугольника, экран рисуется полосками ---------- */
function proj(x, y, z, cam) { const f = cam.f / (cam.d + z); return [cam.cx + x * f, cam.cy + y * f]; }
function rot3(x, y, z, yaw, pitch, roll) {
  let c = Math.cos(roll), s = Math.sin(roll); [x, y] = [x * c - y * s, x * s + y * c];
  c = Math.cos(pitch); s = Math.sin(pitch); [y, z] = [y * c - z * s, y * s + z * c];
  c = Math.cos(yaw); s = Math.sin(yaw); [x, z] = [x * c + z * s, -x * s + z * c];
  return [x, y, z];
}
function phone(screenSrc, P) {
  // P: cx, cy, h (высота корпуса в пикселях), yaw, pitch, roll, a
  const hw = .5 * .4618, hh = .5, rad = .075, cam = { f: P.h * 2.4, d: 2.4, cx: P.cx, cy: P.cy };
  const pt = (x, y, z = 0) => { const [a, b, c] = rot3(x, y, z, P.yaw, P.pitch, P.roll); return proj(a, b, c, cam); };
  const rrPath = (w, h, r, z) => { const pts = []; const cs = [[w - r, -h + r, -Math.PI / 2], [w - r, h - r, 0], [-w + r, h - r, Math.PI / 2], [-w + r, -h + r, Math.PI]];
    cs.forEach(([cx, cy, a0]) => { for (let i = 0; i <= 8; i++) { const a = a0 + i / 8 * Math.PI / 2; pts.push(pt(cx + Math.cos(a) * r, cy + Math.sin(a) * r, z)); } }); return pts; };
  const poly = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); };
  ctx.save(); ctx.globalAlpha *= P.a ?? 1;
  // тень и корпус (торец — слой со сдвигом по глубине)
  ctx.save(); ctx.filter = `blur(${40 * U}px)`; ctx.globalAlpha *= .6; poly(rrPath(hw, hh, rad, .06)); ctx.fillStyle = '#000'; ctx.fill(); ctx.restore();
  poly(rrPath(hw + .012, hh + .012, rad + .01, .03)); ctx.fillStyle = '#2b2226'; ctx.fill();
  poly(rrPath(hw + .012, hh + .012, rad + .01, 0)); const bg = ctx.createLinearGradient(P.cx - P.h * .3, P.cy - P.h * .5, P.cx + P.h * .3, P.cy + P.h * .5); bg.addColorStop(0, '#6b5a60'); bg.addColorStop(.5, '#1a1215'); bg.addColorStop(1, '#4a3b40'); ctx.fillStyle = bg; ctx.fill();
  poly(rrPath(hw - .004, hh - .004, rad - .004, -.001)); ctx.fillStyle = '#050304'; ctx.fill();
  // экран
  const sw = hw - .016, sh = hh - .016;
  ctx.save(); poly(rrPath(sw, sh, rad - .014, -.002)); ctx.clip();
  const N = 60, img = screenSrc, iw = img.width, ih = img.height;
  for (let i = 0; i < N; i++) {
    const u0 = i / N, u1 = (i + 1) / N, x0 = -sw + 2 * sw * u0, x1 = -sw + 2 * sw * u1;
    const A = pt(x0, -sh, -.002), B = pt(x1, -sh, -.002), Cc = pt(x0, sh, -.002);
    ctx.save(); ctx.setTransform((B[0] - A[0]) / (iw / N), (B[1] - A[1]) / (iw / N), (Cc[0] - A[0]) / ih, (Cc[1] - A[1]) / ih, A[0], A[1]);
    ctx.drawImage(img, iw * u0, 0, iw / N + 1, ih, 0, 0, iw / N + 1, ih); ctx.restore();
  }
  // блик на стекле
  const L = pt(-sw, -sh), R = pt(sw, sh); const gl = ctx.createLinearGradient(L[0], L[1], R[0], R[1]); gl.addColorStop(0, 'rgba(255,255,255,.18)'); gl.addColorStop(.35, 'rgba(255,255,255,0)'); gl.addColorStop(1, 'rgba(255,255,255,.04)');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);
  // «остров» камеры
  const I = pt(0, -sh + .035, -.003); ctx.beginPath(); ctx.ellipse(I[0], I[1], P.h * .045, P.h * .012, P.roll, 0, TAU); ctx.fillStyle = '#000'; ctx.fill();
  ctx.restore(); ctx.restore();
  return pt;
}

/* ---------- фон ---------- */
function backdrop(t) {
  const g = ctx.createLinearGradient(0, 0, W * .3, H); g.addColorStop(0, '#1d0c17'); g.addColorStop(.6, '#0d0609'); g.addColorStop(1, '#170910');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glow(W * .78 + 60 * Math.sin(t * .4), H * .25, 900 * U, '180,92,255', .16); glow(W * .2, H * .82 + 40 * Math.cos(t * .3), 900 * U, '240,23,122', .12); glow(W * .5, H * .5, 700 * U, '247,181,10', .06);
}
function grain(frame) { const r = (n => () => { n ^= n << 13; n >>>= 0; n ^= n >> 17; n ^= n << 5; n >>>= 0; return n / 4294967296; })(frame * 7919 + 13); ctx.save(); ctx.globalAlpha = .035; for (let i = 0; i < 900; i++) { ctx.fillStyle = r() > .5 ? '#fff' : '#000'; ctx.fillRect(r() * W, r() * H, 2, 2); } ctx.restore(); }
function vignette(a = .55) { const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .72); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }

/* ================= сцены ================= */
// стеклянные «чипы», вылетающие из телефона в 3D
const CHIPS = [['● 36/36', 'свободно сейчас', C.gold, -.36, -.34, .28], ['Sky Pool', '38 этаж · LIVE', C.pink, .33, -.12, .34], ['Le Ciel', '30 этаж · кухня', C.gold, -.38, .2, .22], ['Лифт', '20–26 этаж', C.violet, .35, .32, .3]];
function chip3d(pt, [ttl, sub, col, x, y, z], p, t, i) {
  if (p <= 0) return; const [sx, sy] = pt(x * p, y * p, -z * p); const sc = (1 + z * p * 1.2) * U;
  const w = 300 * sc, h = 104 * sc; const bx = sx - w / 2, by = sy - h / 2 + Math.sin(t * 2 + i) * 6 * U;
  glass(bx, by, w, h, 26 * sc, clamp(p * 2));
  ctx.save(); ctx.globalAlpha = clamp(p * 2); txt(ttl, bx + 26 * sc, by + 46 * sc, 30 * sc, i ? C.ink : C.gold, { fam: DISP, w: 800 }); txt(sub, bx + 26 * sc, by + 80 * sc, 20 * sc, C.mut, { w: 400 });
  ctx.beginPath(); ctx.arc(bx + w - 30 * sc, by + 30 * sc, 7 * sc, 0, TAU); ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function phoneScreenCanvas(kind, t) {
  // экран телефона: в начале — главная сайта, при «нырке» — живая башня, в финале — логотип
  if (!phoneScreenCanvas.c) { const c = document.createElement('canvas'); c.width = 585; c.height = 1266; phoneScreenCanvas.c = c; }
  const c = phoneScreenCanvas.c, g = c.getContext('2d');
  if (kind === 'home') g.drawImage(IMG.mob, 0, 0, c.width, c.height);
  if (kind === 'logo') {
    g.fillStyle = '#070305'; g.fillRect(0, 0, c.width, c.height);
    const gr = g.createRadialGradient(c.width / 2, c.height * .45, 0, c.width / 2, c.height * .45, c.width * .8); gr.addColorStop(0, 'rgba(122,30,38,.55)'); gr.addColorStop(1, 'rgba(122,30,38,0)'); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);

  if (towerOn(t) && snapT && tIn > 0) {
    ctx.save(); ctx.globalAlpha = tIn * (1 - tOut);
    const blurB = Math.max(prog(t, T.form - .2, T.form + .5) * 10 * (1 - tOut), (1 - tIn) * 12); if (blurB > .3) ctx.filter = `blur(${blurB.toFixed(1)}px)`;
    const z = lerp(1.25, 1, tIn) * lerp(1, .6, tOut); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.drawImage(snapT, -W / 2, -H / 2); ctx.restore();
    // кинематографичная полоса света при облёте
    if (t < T.flyEnd) glow(W * .7, H * .2, 700 * U, '180,92,255', .1);
    vignette(.5);
  }
  // вспышка при нырке в окно номера
  const fl = Math.exp(-(((t - T.flash) / .12) ** 2)); if (fl > .01) { ctx.fillStyle = `rgba(255,236,200,${.85 * fl})`; ctx.fillRect(0, 0, W, H); }
  snapshotBase();
  if (t < T.dive + .5) sIntro(t);
  if (t > T.title1 - .1 && t < T.flyEnd) sFly(t);
  caption(t, 'Выбери этаж', 'лифт уже едет', T.lift + .2, T.plan + .2);
  caption(t, 'Выбери номер', 'окно загорится на башне', T.plan + .3, T.dolly);
  sLift(t); sPlan(t);
  caption(t, 'Забронируй', 'в пару касаний', T.form + .4, T.pull - .1);
  sForm(t); sOutro(t);
  grain(frame);
  const fade = Math.min(prog(t, 0, .3), 1 - prog(t, DUR - .45, DUR)); if (fade < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fade})`; ctx.fillRect(0, 0, W, H); }
}

// звуковые события (promo/ad4_sfx.py)
const CUES = [
  { t: 0.05, type: 'air', dur: 1.1 }, ...CHIPS.map((_, i) => ({ t: T.chips + .1 + i * .15, type: 'glass', pitch: 1 + i * .12 })),
  { t: T.dive - .5, type: 'riser', dur: .55 }, { t: T.dive + .05, type: 'whoosh', dur: .8 }, { t: T.dive + .1, type: 'boom' },
  { t: T.flyStart + .2, type: 'wind', dur: T.flyEnd - T.flyStart }, { t: T.title1, type: 'shimmer' }, { t: T.title2, type: 'swish' },
  { t: T.lift, type: 'whoosh', dur: .5 }, { t: T.lift + .2, type: 'glass', pitch: .9 }, { t: T.press, type: 'click' }, { t: T.press + .05, type: 'button' },
  { t: T.press + .2, type: 'hum', dur: T.arrive - T.press - .1 }, ...Array.from({ length: FLOOR - 20 }, (_, i) => ({ t: T.press + .15 + (T.arrive - T.press - .15) * (i + 1) / (FLOOR - 20), type: 'tick', pitch: 1 + i * .05 })),
  { t: T.arrive, type: 'ding' }, { t: T.plan, type: 'whoosh', dur: .5 }, ...[0, 1, 2, 3, 4, 5].map(i => ({ t: T.plan + .2 + i * .06, type: 'tick', pitch: .9 + i * .04 })),
  ...[0, 1, 2, 3, 4, 5].map(i => ({ t: T.hover0 + i * .3, type: 'hover' })), { t: T.pick, type: 'click' }, { t: T.pick + .05, type: 'select' }, { t: T.card, type: 'glass', pitch: 1.1 },
  { t: T.book, type: 'click' }, { t: T.booked, type: 'confirm' }, { t: T.dolly, type: 'riser', dur: T.flash - T.dolly }, { t: T.flash, type: 'boom' }, { t: T.flash, type: 'whoosh', dur: .7, up: true },
  { t: T.form, type: 'glass', pitch: 1 }, { t: T.send, type: 'click' }, { t: T.send + .05, type: 'process', dur: T.ok - T.send }, { t: T.ok, type: 'confirm' }, { t: T.toast, type: 'notify' },
  { t: T.pull, type: 'whoosh', dur: 1.0 }, { t: T.logo, type: 'shimmer' }, { t: T.cta - .3, type: 'swish' }, { t: T.cta + .5, type: 'chime' }
].map(c => ({ ...c, t: +c.t.toFixed(3) }));

window.AD = { W, H, FPS, DUR, CUES, render, ready };
if (!Q.has('still')) ready().then(() => { let f = 0; const loop = () => { render(f++ % (DUR * FPS)); setTimeout(loop, 1000 / FPS); }; loop(); });
</script>
</body>
